[project]
name = "shoppingagent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harleenkaur13", email = "sainiharleenkaur123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datetime>=6.0",
    "ipykernel>=7.3.0",
    "langchain>=1.3.18",
    "langchain-groq>=1.1.3",
    "langchain-tools>=0.1.34",
    "pydantic>=2.13.5",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
shoppingagent = "shoppingagent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
